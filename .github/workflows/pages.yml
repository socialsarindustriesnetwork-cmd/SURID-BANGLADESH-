name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct v4 release bundle
        run: |
          cat release/v4/site-v4.0.0-*.b64 | base64 --decode > /tmp/site-v4.tar.xz
          echo "8229183d03fe7307fd93043fe4d3b583b1632dcc94ef8646512a11c567d05de0  /tmp/site-v4.tar.xz" | sha256sum --check -
          rm -rf _site
          mkdir -p _site
          tar -xJf /tmp/site-v4.tar.xz -C _site

      - name: Validate site structure
        run: python3 _site/scripts/validate_site.py

      - name: Validate JavaScript
        run: |
          node --check _site/assets/js/app.js
          node --check _site/assets/js/packages.js
          node --check _site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
